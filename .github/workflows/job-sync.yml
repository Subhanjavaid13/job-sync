name: job-sync

on:
  schedule:
    # Twice daily — 03:00 UTC (08:00 Pakistan) and 13:00 UTC (18:00 Pakistan),
    # so a job posted during the day is caught the same day. Each run emails at
    # most ONE digest, and only when there is something new. Cron may drift 5–15 min.
    - cron: '0 3,13 * * *'
  workflow_dispatch: {} # manual "Run workflow" button — run anytime on demand

permissions:
  contents: write # needed to commit the updated dedupe DB back

concurrency:
  group: job-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Run pipeline
        run: npm start
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Run leads pipeline
        # Failures here must never block persisting the jobs dedupe state
        # below — hence continue-on-error. SMTP env is needed for the leads email.
        continue-on-error: true
        run: npm run leads
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Email failure alert
        if: failure()
        run: npm run notify:failure
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Persist dedupe DB
        if: success()
        # Commit only when the run marked the DB meaningfully changed (new
        # jobs/leads or prunes) — run-log-only changes would otherwise produce
        # a commit every 2 hours.
        run: |
          if [ -f data/.db-dirty ]; then
            rm data/.db-dirty
            git config user.name "job-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.db
            git diff --cached --quiet || git commit -m "chore: update dedupe DB [skip ci]"
            git push
          else
            echo "No meaningful DB changes — skipping commit"
          fi
